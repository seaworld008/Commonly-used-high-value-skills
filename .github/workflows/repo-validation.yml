name: Repository Validation

on:
  push:
    branches:
      - main
  pull_request:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.13"

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "22"

      - name: Install test dependencies
        run: python -m pip install pyyaml pytest jsonschema

      - name: Refresh and validate repository
        run: python scripts/validate_repository.py --refresh

      - name: Validate npx installer package
        run: |
          node --check bin/install-skills.js
          node bin/install-skills.js --help
          node bin/install-skills.js list-targets
          npm pack --dry-run --silent

      - name: Generate repo health report
        run: python scripts/generate_repo_health_report.py

      - name: Evaluate repo health thresholds
        run: python scripts/evaluate_repo_health.py

      - name: Publish repo health summary
        run: |
          cat docs/sources/reports/repo-health.md >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          cat docs/sources/reports/repo-health-eval.md >> "$GITHUB_STEP_SUMMARY"

      - name: Ensure generated files are up to date
        run: git diff --exit-code

      - name: Upload repo health artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: repo-health-report
          path: |
            docs/sources/reports/repo-health.json
            docs/sources/reports/repo-health.md
            docs/sources/reports/repo-health-eval.md
          retention-days: 30
