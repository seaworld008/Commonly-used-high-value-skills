name: skills-provenance-ci

on:
  pull_request:
  push:
    branches: ["main", "master"]

jobs:
  provenance-checks:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Install test dependencies
        run: python -m pip install pyyaml pytest

      - name: Check merge conflict markers
        run: python3 scripts/check_merge_conflicts.py

      - name: Run provenance v2 contract tests
        run: python -m pytest -q tests/test_provenance_v2.py

      - name: Run complete repository test suite
        run: python -m pytest -q tests

      - name: Run unified provenance pipeline
        run: python3 scripts/provenance_pipeline.py --mode all --config docs/sources/provenance.config.json

      - name: Ensure provenance mappings are up to date
        run: git diff --exit-code -- docs/sources
