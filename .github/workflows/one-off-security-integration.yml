name: One-off Security Hardening Integration
on:
  push:
    branches: [codex/security-codeql-fix-20261012]
permissions:
  contents: write
concurrency:
  group: security-hardening-once
  cancel-in-progress: false
jobs:
  verify-and-commit:
    if: github.event.head_commit.message == 'security-finalize-trigger'
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - name: Checkout reviewed branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: true
      - name: Setup Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.13'
      - name: Setup Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '22'
      - name: Install test dependencies
        run: python -m pip install pyyaml pytest jsonschema
      - name: Run focused security regressions
        run: |
          set -euo pipefail
          node --check skills/office-white-collar/answer-me-with-html/scripts/am.mjs
          python -m pytest -q tests/test_code_scanning_security_regressions.py
      - name: Refresh verified source digests and derived exports
        run: |
          set -euo pipefail
          python scripts/enrich_frontmatter.py
          python scripts/refresh_repo_views.py
          python scripts/migrate_provenance_v2.py --mapping docs/sources/curated-v3.3.0.skills.json --write --refresh-managed-digests
          python scripts/generate_tags_index.py
          python scripts/build_catalog_json.py
          git add -A -- skills openclaw-skills docs tests README.md README.en.md CHANGELOG.md package.json .github/workflows/publish-release.yml
          git diff --cached --check
      - name: Full repository validation and generation idempotence
        run: |
          set -euo pipefail
          python scripts/validate_repository.py --refresh
          git diff --exit-code
          npm test
      - name: Commit validated data and push
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git diff --cached --quiet && { echo "::error::No changes to commit"; exit 1; }
          git commit -m "fix(security): synchronize hardened Skills, OpenClaw exports and provenance"
          test -z "$(git status --porcelain)"
          git push origin HEAD:codex/security-codeql-fix-20261012
