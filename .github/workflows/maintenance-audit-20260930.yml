name: Full skills maintenance preparation

on:
  push:
    branches: [codex/grill-me-maintenance-20260930]
    paths: [.github/workflows/maintenance-audit-20260930.yml]
permissions:
  contents: write
  actions: read
jobs:
  maintenance:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - name: Checkout reviewed transfer data
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          path: transfer
          persist-credentials: false
      - name: Checkout immutable merged grill-me main
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: d392979066d6b9449a9f414ffcf7f8c11c924692
          fetch-depth: 0
          path: candidate
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: '3.13'
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: '22'
      - name: Download immutable reviewed source evidence
        working-directory: candidate
        run: |
          gh run download 36709677523 -n maintenance-upstream-deltas -D "$RUNNER_TEMP/evidence"
          gh run download 36710320354 -n maintenance-upstream-closure -D "$RUNNER_TEMP/evidence"
      - name: Verify and reconstruct 501 reviewed maintenance files
        working-directory: candidate
        run: |
          python ../transfer/.github/maintenance-20260930/reconstruct.py --parts ../transfer/.github/maintenance-20260930/maintenance.part{00..10}.b64 --sha256 f0abc8051fd9cfa2e6f4eb48c178d8951ed0e17d5550b03316810a965a7e1a07 --evidence "$RUNNER_TEMP/evidence"
          test ! -e .github/maintenance-20260930
          test ! -e .github/workflows/maintenance-audit-20260930.yml
      - name: Generate and stage exports before Git-index tests
        working-directory: candidate
        run: |
          python -m pip install pyyaml pytest jsonschema
          python - <<'PY'
          import subprocess, sys
          sys.path.insert(0, 'scripts')
          from validate_repository import REFRESH
          for command in REFRESH:
              subprocess.run([sys.executable, *command], check=True)
          PY
          git add -A
      - name: Run complete maintenance validation
        working-directory: candidate
        run: |
          python scripts/validate_repository.py --refresh
          node --test skills/security-and-reliability/security-audit/validate-coverage-ledger.test.cjs skills/security-and-reliability/security-audit/validate-findings.test.cjs
          npm test
          python scripts/generate_repo_health_report.py
          python scripts/evaluate_repo_health.py
      - name: Commit reviewed maintenance and regenerate actual history
        working-directory: candidate
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'chore: curate all skill sources and prepare v3.2.0'
          python scripts/generate_changelog.py --preserve-history
          git add CHANGELOG.md
          if ! git diff --cached --quiet; then git commit -m 'docs: refresh maintenance changelog from actual history'; fi
          python - <<'PY'
          import subprocess, sys
          sys.path.insert(0, 'scripts')
          from validate_repository import REFRESH
          for command in REFRESH:
              subprocess.run([sys.executable, *command], check=True)
          PY
          git diff --exit-code
          gh auth setup-git
          git push origin HEAD:refs/heads/codex/skills-maintenance-20260930
          mkdir -p "$RUNNER_TEMP/maintenance-result"
          git rev-parse HEAD > "$RUNNER_TEMP/maintenance-result/head.txt"
          git rev-parse HEAD^{tree} > "$RUNNER_TEMP/maintenance-result/tree.txt"
          git bundle create "$RUNNER_TEMP/maintenance-result/repository.bundle" HEAD
      - name: Upload verified maintenance result
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: skills-maintenance-prepared
          path: ${{ runner.temp }}/maintenance-result/
          retention-days: 3
