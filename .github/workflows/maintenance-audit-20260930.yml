name: Recover maintenance evidence

on:
  push:
    branches: [codex/grill-me-maintenance-20260930]
    paths: [.github/workflows/maintenance-audit-20260930.yml]
permissions:
  contents: read
jobs:
  recover:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Export committed recovery data and current refs
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p "$RUNNER_TEMP/recovery"
          git bundle create "$RUNNER_TEMP/recovery/repository.bundle" --all
          git rev-parse origin/main > "$RUNNER_TEMP/recovery/main.txt"
          gh api repos/seaworld008/Commonly-used-high-value-skills/releases/latest > "$RUNNER_TEMP/recovery/latest-release.json"
          git status --short --branch
          git worktree list
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: maintenance-recovery
          path: ${{ runner.temp }}/recovery/
          retention-days: 14
