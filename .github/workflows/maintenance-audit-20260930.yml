name: Review fresh upstream deltas
on:
  push:
    branches: [codex/grill-me-maintenance-20260930]
    paths: [.github/workflows/maintenance-audit-20260930.yml]
permissions:
  contents: read
  actions: read
jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: 5ea7154e7ed04dbf997df3cb23ed85fe1af28055
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.13'
      - name: Download current read-only report
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh run download 37147008919 -n skills-maintenance-recovered -D "$RUNNER_TEMP/current"
      - name: Compare declared artifact sets and new regular siblings, without running upstream code
        env:
          GH_TOKEN: ${{ github.token }}
        shell: python
        run: |
          import base64, dataclasses, hashlib, json, os, pathlib, posixpath, sys
          sys.path.insert(0, 'scripts')
          from github_artifact_provider import GitHubArtifactProvider
          provider = GitHubArtifactProvider(token=os.environ['GH_TOKEN'])
          out = pathlib.Path(os.environ['RUNNER_TEMP']) / 'deltas'
          out.mkdir()
          report = json.loads((out.parent / 'current/upstream-current.json').read_text())
          wanted = {r['name']: r for r in report['results'] if r['status'] == 'monitor_review'}
          data = {'base': '5ea7154e7ed04dbf997df3cb23ed85fe1af28055', 'report': report, 'entries': [], 'errors': []}
          def save():
              (out / 'fresh-deltas.json').write_text(json.dumps(data, ensure_ascii=False, indent=2) + '\n')
          def payload(repo, item):
              if not item or item.get('type') != 'blob' or item.get('mode') not in ('100644','100755'):
                  return None
              raw = provider.blob(repo, item['sha'])
              return {'blob': item['sha'], 'mode': item['mode'], 'sha256': hashlib.sha256(raw).hexdigest(), 'base64': base64.b64encode(raw).decode()}
          def expand(origin, tree, entry):
              files = {}
              for a in origin.get('artifacts', []):
                  source, target = a['source'], a['target']
                  if a.get('type','file') == 'file': files[target] = source
                  else:
                      prefix = source.rstrip('/') + '/'
                      files.update({target.rstrip('/') + '/' + p[len(prefix):]: p for p,it in tree.items() if p.startswith(prefix) and it['type'] == 'blob'})
              siblings = {}
              if origin['path'].endswith('/SKILL.md'):
                  prefix = posixpath.dirname(origin['path']) + '/'
                  siblings = {posixpath.dirname(entry['repo_skill']) + '/' + p[len(prefix):]: p for p,it in tree.items() if p.startswith(prefix) and it['type'] == 'blob'}
              return files, siblings
          for mapping in sorted(pathlib.Path('docs/sources').glob('*.skills.json')):
              for entry in json.loads(mapping.read_text()).get('skills', []):
                  name = entry.get('normalized_slug')
                  if name not in wanted: continue
                  result = wanted[name]
                  row = {'name': name, 'mapping': str(mapping), 'repo_skill': entry['repo_skill'], 'origins': []}
                  data['entries'].append(row)
                  for index, origin in enumerate(entry.get('origins', [])):
                      repo = origin.get('repo')
                      if repo != result['repository'] or origin.get('sync_mode') == 'archived': continue
                      try:
                          old = origin['tracking']['resolved_commit']; new = result['current_commit']
                          before = provider.tree(repo, old); after = provider.tree(repo, new)
                          current = {'index': index, 'repo': repo, 'old': old, 'new': new, 'path': origin['path'], 'license': dataclasses.asdict(provider.license_evidence(repo,new)), 'changed': [], 'new_siblings': [], 'special_objects': []}
                          row['origins'].append(current)
                          a, siblings_a = expand(origin,before,entry); b, siblings_b = expand(origin,after,entry)
                          for target in sorted(set(a)|set(b)):
                              source = b.get(target,a.get(target)); left = before.get(a.get(target,source)); right = after.get(source)
                              if (left or {}).get('sha') == (right or {}).get('sha') and (left or {}).get('mode') == (right or {}).get('mode'): continue
                              current['changed'].append({'source': source, 'target': target, 'old': payload(repo,left), 'new': payload(repo,right)})
                          for target, source in sorted(siblings_b.items()):
                              if target in b or source in siblings_a.values(): continue
                              item = after[source]
                              if item['mode'] not in ('100644','100755'):
                                  current['special_objects'].append({'source':source,'mode':item['mode']}); continue
                              current['new_siblings'].append({'source':source,'target':target,'new':payload(repo,item)})
                          print(name, 'changed',len(current['changed']),'new siblings',len(current['new_siblings']),flush=True)
                      except Exception as exc:
                          data['errors'].append({'name': name, 'repo': repo, 'error': str(exc)})
                  save()
          assert set(wanted) == {e['name'] for e in data['entries']}
          save()
      - name: Upload complete delta evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: fresh-upstream-deltas
          path: ${{ runner.temp }}/deltas/
          retention-days: 14
