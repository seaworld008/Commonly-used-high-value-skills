name: Maintenance audit 20260930

on:
  push:
    branches: [codex/grill-me-maintenance-20260930]
    paths: [.github/workflows/maintenance-audit-20260930.yml]
permissions:
  contents: read
  actions: read
jobs:
  dependency-closure:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.13'
      - name: Download immutable source inventory
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh run download 36709677523 -n maintenance-upstream-deltas -D "$RUNNER_TEMP/upstream-deltas"
      - name: Inspect regular new resources without following symlinks
        env:
          GITHUB_TOKEN: ${{ github.token }}
        shell: python
        run: |
          import base64, hashlib, json, os, pathlib, posixpath, sys
          sys.path.insert(0, 'scripts')
          from github_artifact_provider import GitHubArtifactProvider
          out = pathlib.Path(os.environ['RUNNER_TEMP']) / 'upstream-closure'
          out.mkdir()
          snapshot = json.loads((out.parent / 'upstream-deltas/snapshots.json').read_text())
          provider = GitHubArtifactProvider(token=os.environ['GITHUB_TOKEN'])
          data = {'files': [], 'special_objects_not_imported': [], 'errors': []}
          for entry in snapshot['entries']:
              for origin in entry['origins']:
                  if not origin['origin_path'].endswith('/SKILL.md'):
                      continue
                  repo, commit = origin['repo'], origin['current_commit']
                  tree = snapshot['trees'][repo + '@' + commit]
                  prefix = posixpath.dirname(origin['origin_path']) + '/'
                  known = {item['source'] for item in origin['files']}
                  for path, item in sorted(tree.items()):
                      if not path.startswith(prefix) or item.get('type') != 'blob' or path in known:
                          continue
                      row = {'name': entry['name'], 'repo': repo, 'commit': commit, 'source': path, 'target': posixpath.dirname(entry['repo_skill']) + '/' + path[len(prefix):], 'mode': item['mode'], 'blob_sha': item['sha']}
                      if item['mode'] not in ('100644', '100755'):
                          data['special_objects_not_imported'].append(row)
                          continue
                      try:
                          raw = provider.blob(repo, item['sha'])
                          row.update(sha256=hashlib.sha256(raw).hexdigest(), base64=base64.b64encode(raw).decode())
                          data['files'].append(row)
                      except Exception as exc:
                          data['errors'].append({'source': path, 'error': str(exc)})
          (out / 'closure.json').write_text(json.dumps(data, ensure_ascii=False, indent=2) + '\n')
          print('Regular new resources:', len(data['files']), 'Rejected symlink/git objects:', len(data['special_objects_not_imported']), 'Errors:', len(data['errors']))
      - name: Upload dependency evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: maintenance-upstream-closure
          path: ${{ runner.temp }}/upstream-closure/
          retention-days: 3
