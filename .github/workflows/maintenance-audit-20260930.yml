name: Publish validated v3.2.0 draft
on:
  push:
    branches: [codex/grill-me-maintenance-20260930]
    paths: [.github/workflows/maintenance-audit-20260930.yml]
permissions:
  contents: write
  actions: read
concurrency:
  group: publish-verified-v3.2.0
  cancel-in-progress: false
jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      GH_TOKEN: ${{ github.token }}
      RELEASE_SHA: 5713743cabfef76135d1cc96a19f656395135632
      REPO: seaworld008/Commonly-used-high-value-skills
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: 5713743cabfef76135d1cc96a19f656395135632
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.13'
      - name: Retrieve tested verifier and previous independent draft verification
        run: |
          gh run download 37149476466 -n v3.2.0-release-verification -D "$RUNNER_TEMP/evidence"
          printf '%s  %s\n' 706446d8225558d9d66fb755cf7a3a9c72c7083ac44e9983f280eca944e6097b "$RUNNER_TEMP/evidence/release_verify.py" | sha256sum -c -
          cmp "$RUNNER_TEMP/evidence/build-verification.json" "$RUNNER_TEMP/evidence/download-verification.json"
          gh release download v3.2.0 --repo "$REPO" --dir "$RUNNER_TEMP/downloaded"
      - name: Independently revalidate the existing assets without replacing anything
        run: |
          test "$(find "$RUNNER_TEMP/downloaded" -maxdepth 1 -type f | wc -l)" -eq 4
          cmp "$RUNNER_TEMP/evidence/SHA256SUMS" "$RUNNER_TEMP/downloaded/SHA256SUMS"
          (cd "$RUNNER_TEMP/downloaded" && sha256sum -c SHA256SUMS) | tee "$RUNNER_TEMP/evidence/final-sha256.log"
          python "$RUNNER_TEMP/evidence/release_verify.py" --directory "$RUNNER_TEMP/downloaded" --sha "$RELEASE_SHA" > "$RUNNER_TEMP/evidence/final-archive-verification.json"
          cmp "$RUNNER_TEMP/evidence/build-verification.json" "$RUNNER_TEMP/evidence/final-archive-verification.json"
      - name: Check exact main and publish the known draft by ID
        shell: python
        run: |
          import hashlib, json, os, pathlib, subprocess, time
          repo=os.environ['REPO']; sha=os.environ['RELEASE_SHA']; root=pathlib.Path(os.environ['RUNNER_TEMP'])
          def api(path): return json.loads(subprocess.check_output(['gh','api','repos/'+repo+'/'+path],text=True))
          assert api('git/ref/heads/main')['object']['sha']==sha
          pr=api('pulls/129')
          assert pr['merged'] and pr['merge_commit_sha']==sha
          report=json.loads((root/'evidence/upstream-final.json').read_text())
          assert report['state']=='complete' and report['summary']=={'total':153,'equal':128,'changed':0,'monitor_review':0,'unavailable':0,'rollback':0,'expected_skipped':25}
          checks=json.loads((root/'evidence/main-ci.json').read_text())
          assert checks['commit']==sha
          assert {x['name'] for x in checks['checks']}=={'Repository Validation','skills-provenance-ci','CodeQL'}
          for check in checks['checks']:
              run=api('actions/runs/'+str(check['id']))
              assert run['head_sha']==sha and run['head_branch']=='main' and run['event']=='push'
              assert run['status']=='completed' and run['conclusion']=='success'
          assert api('releases/latest')['tag_name']=='v3.1.0'
          release=api('releases/402667437')
          assert release['id']==402667437 and release['tag_name']=='v3.2.0'
          assert release['draft'] and not release['prerelease'] and release['target_commitish']==sha
          expected={'high-value-skills-v3.2.0.tar.gz':'17d61d72bc10319837870f883559e5da7267c8ccfc1d34f2fcd63f89e57fbdc5','common-high-value-skills-3.2.0.tgz':'67317b018952e058e7519740889ed9db25552e03a4712722cc3a9eaaf6f4f9b9','release-manifest.json':'30eee01a6560e7d169f749cd552d3e5d69b6147fa6cd0116973c8966a979b19b','SHA256SUMS':'3c1728e81be86c1b4355cf94c896d1fa582d881355f2bb3579fea13c9a0af48f'}
          assert {a['name'] for a in release['assets']}==expected.keys()
          for asset in release['assets']:
              assert asset['state']=='uploaded' and asset['digest']=='sha256:'+expected[asset['name']]
              with (root/'downloaded'/asset['name']).open('rb') as f:
                  assert hashlib.file_digest(f,'sha256').hexdigest()==expected[asset['name']]
          published=json.loads(subprocess.check_output(['gh','api','--method','PATCH','repos/'+repo+'/releases/402667437','--field','draft=false','--field','prerelease=false','--raw-field','make_latest=true'],text=True))
          assert published['id']==402667437 and not published['draft'] and not published['prerelease']
          for attempt in range(10):
              latest=api('releases/latest')
              if latest['id']==402667437: break
              time.sleep(2)
          else: raise RuntimeError('Published release was not reflected by latest endpoint')
          obj=api('git/ref/tags/v3.2.0')['object']
          for _ in range(5):
              if obj['type']!='tag': break
              obj=api('git/tags/'+obj['sha'])['object']
          assert obj['type']=='commit' and obj['sha']==sha
          (root/'evidence/published-release.json').write_text(json.dumps(latest,ensure_ascii=False,indent=2)+'\n')
          (root/'evidence/published-tag.json').write_text(json.dumps(obj,indent=2)+'\n')
          print('Published, Latest and exact tag verified:',latest['html_url'],sha)
      - name: Preserve exact main source and clean checkout proof
        run: |
          git diff --exit-code
          git status --porcelain > "$RUNNER_TEMP/evidence/main-worktree-status.txt"
          test ! -s "$RUNNER_TEMP/evidence/main-worktree-status.txt"
          git bundle create "$RUNNER_TEMP/evidence/merged-main.bundle" HEAD
      - name: Upload final release evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: v3.2.0-final-release-verification
          path: ${{ runner.temp }}/evidence/
          if-no-files-found: warn
          retention-days: 30
