name: Changelog Refresh

on:
  schedule:
    - cron: '0 3 * * 1'  # Every Monday 03:00 UTC (after upstream-sync at 02:00)
  workflow_dispatch:
    inputs:
      since:
        description: "Starting tag/ref/date (default: latest reachable tag)"
        required: false
        default: "last-tag"

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  refresh-changelog:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.13'

      - name: Regenerate CHANGELOG.md
        env:
          CHANGELOG_SINCE: ${{ github.event.inputs.since || 'last-tag' }}
        run: python scripts/generate_changelog.py --since "$CHANGELOG_SINCE" --preserve-history --output CHANGELOG.md

      - name: Detect changes
        id: diff
        run: |
          if git diff --quiet CHANGELOG.md; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Open PR with refreshed changelog
        if: steps.diff.outputs.changed == 'true'
        uses: peter-evans/create-pull-request@c5a7806660adbe173f04e3e038b0ccdcd758773c # v6
        with:
          commit-message: "chore: refresh CHANGELOG from recent commits"
          title: "chore: refresh CHANGELOG.md"
          body: |
            Auto-generated by `scripts/generate_changelog.py --preserve-history` covering commits since `${{ github.event.inputs.since || 'last-tag' }}`.

            Only the managed Unreleased block is refreshed; curated notes and released history must remain unchanged.
            Review the diff and require validation checks before merging.
          branch: chore/changelog-refresh
          delete-branch: true
          labels: auto-sync,changelog
          add-paths: CHANGELOG.md
