name: Temporary curated source refresh
on:
  push:
    branches: [codex/curation-20261024]
permissions:
  contents: write
jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: true
          fetch-depth: 0
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.13'
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '22'
      - name: Reconcile changed managed digests and generated views
        run: |
          set -euo pipefail
          python -m pip install pyyaml pytest jsonschema
          python scripts/migrate_provenance_v2.py --write --refresh-managed-digests
          python scripts/validate_repository.py --refresh
          npm test
          node --test skills/security-and-reliability/security-audit/validate-coverage-ledger.test.cjs skills/security-and-reliability/security-audit/validate-findings.test.cjs
      - name: Archive verified v4.1.0 history and prepare next changelog
        run: python scripts/generate_changelog.py --preserve-history --archive-tag v4.1.0 --since v4.1.0 --to HEAD
      - name: Commit only refreshed source-derived artifacts
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add docs/sources docs/catalog.json skills openclaw-skills README.md README.en.md .github/assets/repo-banner.svg docs/TAGS-INDEX.md CHANGELOG.md
          if ! git diff --cached --quiet; then
            git commit -m 'chore: regenerate curated skill exports and provenance'
            git push origin HEAD:refs/heads/codex/curation-20261024
          fi
          python scripts/validate_repository.py --refresh
          git diff --exit-code
