name: Routine maintenance evidence 20261006
on:
  push:
    branches: [codex/routine-audit-20261006]
    paths: [.github/workflows/routine-audit-20261006.yml]
permissions:
  contents: read
jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: 5713743cabfef76135d1cc96a19f656395135632
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: '3.13'
      - name: Check every tracked upstream without applying changes
        shell: bash
        run: |
          mkdir -p "$RUNNER_TEMP/evidence"
          set +e
          timeout 900 python scripts/sync_upstream.py --check-only --report-json "$RUNNER_TEMP/evidence/upstream.json" > "$RUNNER_TEMP/evidence/upstream.log" 2>&1
          status=$?
          printf '%s\n' "$status" > "$RUNNER_TEMP/evidence/upstream-exit.txt"
          date -u +%FT%TZ > "$RUNNER_TEMP/evidence/checked-at.txt"
          tail -10 "$RUNNER_TEMP/evidence/upstream.log"
          exit 0
      - name: Collect immutable changed-file and license evidence without executing upstream files
        shell: python
        run: |
          import base64, dataclasses, hashlib, json, os, pathlib, posixpath, sys
          sys.path.insert(0, 'scripts')
          from github_artifact_provider import GitHubArtifactProvider
          provider = GitHubArtifactProvider(token=os.environ['GH_TOKEN'])
          out = pathlib.Path(os.environ['RUNNER_TEMP']) / 'evidence'
          report = json.loads((out / 'upstream.json').read_text())
          wanted = {r['name']: r for r in report['results'] if r['status'] in ('monitor_review','changed','artifact_changed')}
          data = {'base': '5713743cabfef76135d1cc96a19f656395135632', 'entries': [], 'errors': []}
          def payload(repo, item):
              if not item or item.get('type') != 'blob' or item.get('mode') not in ('100644','100755'): return None
              raw = provider.blob(repo, item['sha'])
              assert hashlib.sha1(b'blob '+str(len(raw)).encode()+b'\0'+raw).hexdigest()==item['sha']
              return {'blob':item['sha'],'mode':item['mode'],'sha256':hashlib.sha256(raw).hexdigest(),'base64':base64.b64encode(raw).decode()}
          def expand(origin, tree, entry):
              files = {}
              for a in origin.get('artifacts', []):
                  source, target = a['source'], a['target']
                  if a.get('type','file') == 'file': files[target] = source
                  else:
                      prefix = source.rstrip('/') + '/'
                      files.update({target.rstrip('/')+'/'+p[len(prefix):]:p for p,it in tree.items() if p.startswith(prefix) and it['type']=='blob'})
              return files
          for mapping in sorted(pathlib.Path('docs/sources').glob('*.skills.json')):
              for entry in json.loads(mapping.read_text()).get('skills', []):
                  name = entry.get('normalized_slug')
                  if name not in wanted: continue
                  result = wanted[name]
                  row = {'name':name,'mapping':str(mapping),'repo_skill':entry['repo_skill'],'origins':[]}
                  data['entries'].append(row)
                  for index, origin in enumerate(entry.get('origins', [])):
                      repo = origin.get('repo')
                      if repo != result['repository'] or origin.get('sync_mode') == 'archived': continue
                      try:
                          old=origin['tracking']['resolved_commit']; new=result['current_commit']
                          before=provider.tree(repo,old); after=provider.tree(repo,new)
                          current={'index':index,'repo':repo,'old':old,'new':new,'path':origin['path'],'license':dataclasses.asdict(provider.license_evidence(repo,new)),'changed':[],'new_siblings':[]}
                          row['origins'].append(current)
                          a=expand(origin,before,entry); b=expand(origin,after,entry)
                          for target in sorted(set(a)|set(b)):
                              source=b.get(target,a.get(target)); left=before.get(a.get(target,source)); right=after.get(source)
                              if (left or {}).get('sha')==(right or {}).get('sha') and (left or {}).get('mode')==(right or {}).get('mode'): continue
                              current['changed'].append({'source':source,'target':target,'old':payload(repo,left),'new':payload(repo,right)})
                          if origin['path'].endswith('/SKILL.md'):
                              prefix=posixpath.dirname(origin['path'])+'/'
                              for path,item in after.items():
                                  target=posixpath.dirname(entry['repo_skill'])+'/'+path[len(prefix):]
                                  if path.startswith(prefix) and path not in before and target not in b and item['type']=='blob':
                                      current['new_siblings'].append({'source':path,'target':target,'new':payload(repo,item),'mode':item['mode']})
                          print(name,'changed',len(current['changed']),'new',len(current['new_siblings']),flush=True)
                      except Exception as exc: data['errors'].append({'name':name,'repo':repo,'error':str(exc)})
                  (out/'deltas.json').write_text(json.dumps(data,ensure_ascii=False)+'\n')
          assert set(wanted)=={e['name'] for e in data['entries']}
          (out/'deltas.json').write_text(json.dumps(data,ensure_ascii=False)+'\n')
      - name: Record current refs, release and open PR patch
        run: |
          gh api repos/seaworld008/Commonly-used-high-value-skills/releases/latest > "$RUNNER_TEMP/evidence/latest-release.json"
          gh pr diff 130 > "$RUNNER_TEMP/evidence/pr130.diff"
          gh api repos/seaworld008/Commonly-used-high-value-skills/pulls/130 > "$RUNNER_TEMP/evidence/pr130.json"
          git bundle create "$RUNNER_TEMP/evidence/main.bundle" HEAD
          git diff --exit-code
      - name: Upload audit evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: routine-audit-20261006
          path: ${{ runner.temp }}/evidence/
          if-no-files-found: error
          retention-days: 14
