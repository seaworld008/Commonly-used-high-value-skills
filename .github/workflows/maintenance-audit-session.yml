name: Maintenance audit session

on:
  push:
    branches: [codex/audit-maintenance-20260928]
    paths: [.github/workflows/maintenance-audit-session.yml]
permissions:
  contents: read
jobs:
  stable:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: 4d170b083cd41ad5d16fa088bcfe8f73da55df6f
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.13'
      - run: python -m pip install pyyaml jsonschema
      - name: Apply only stable eligible Hermes mappings in disposable checkout
        env:
          GITHUB_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/stable-review"
          python scripts/sync_upstream.py --apply --source github:NousResearch/hermes-agent --report-json "$RUNNER_TEMP/stable-review/report.json" > "$RUNNER_TEMP/stable-review/sync.log" 2>&1
          git diff --binary > "$RUNNER_TEMP/stable-review/stable.patch"
          git diff --stat
          cat "$RUNNER_TEMP/stable-review/sync.log"
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: always()
        with:
          name: maintenance-stable-update
          path: ${{ runner.temp }}/stable-review/
          retention-days: 7
          if-no-files-found: error
