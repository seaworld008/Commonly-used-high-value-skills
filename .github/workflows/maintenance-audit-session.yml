name: Maintenance audit session
on:
  push:
    branches: [codex/audit-maintenance-20260928]
    paths: [.github/workflows/maintenance-audit-session.yml]
permissions:
  contents: read
jobs:
  stable:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: 4d170b083cd41ad5d16fa088bcfe8f73da55df6f
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.13'
      - run: python -m pip install pyyaml jsonschema
      - name: Preserve monitor status and export only verified stable mutation
        env:
          GITHUB_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/stable-review"
          set +e
          python scripts/sync_upstream.py --apply --source github:NousResearch/hermes-agent --reviewed-dependent hermes-open-gsd-workflow=6e1bbecf1c863b1b9895ac94eb66e57750877363b483805cbba4cb39b880c52d --report-json "$RUNNER_TEMP/stable-review/report.json" > "$RUNNER_TEMP/stable-review/sync.log" 2>&1
          result=$?
          set -e
          printf '%s\n' "$result" > "$RUNNER_TEMP/stable-review/exit-code.txt"
          python - <<'PY'
          import json, os, pathlib
          folder=pathlib.Path(os.environ['RUNNER_TEMP'])/'stable-review'
          report=json.loads((folder/'report.json').read_text())
          result=next(r for r in report['results'] if r['name']=='hermes-agent')
          assert result['current_commit']=='f97608f178d1ffeca59860195ab7da295f7c8e5f', result
          assert report.get('apply_errors')==[], report
          assert 'Applied 1 updates.' in (folder/'sync.log').read_text()
          assert report['summary']['unavailable']==0 and report['summary']['rollback']==0
          print('Stable update succeeded; monitor-only candidates remain explicitly unresolved.')
          PY
          git diff --binary > "$RUNNER_TEMP/stable-review/stable.patch"
          git diff --stat
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: always()
        with:
          name: maintenance-stable-update
          path: ${{ runner.temp }}/stable-review/
          retention-days: 7
          if-no-files-found: error
