name: Dead Link Check

on:
  schedule:
    - cron: '0 4 1 * *'  # Monthly, 1st day 04:00 UTC
  workflow_dispatch:

permissions:
  contents: read
  issues: write

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'

      - name: Probe external links
        id: probe
        continue-on-error: true
        run: |
          python scripts/check_dead_links.py --output docs/sources/reports/dead-links.json
          DEAD=$(python -c "import json; print(json.load(open('docs/sources/reports/dead-links.json'))['dead_count'])")
          echo "dead_count=$DEAD" >> "$GITHUB_OUTPUT"

      - name: Prepare issue body if any dead
        if: steps.probe.outputs.dead_count != '0'
        run: |
          python - <<'PY'
          import json, pathlib
          data = json.load(open('docs/sources/reports/dead-links.json'))
          lines = [f"# Dead links report — {data['generated_at']}", "",
                   f"**{data['dead_count']}** unreachable URLs out of **{data['total']}** scanned.", ""]
          for row in data['dead']:
              refs = ', '.join(f"`{r}`" for r in row['refs'])
              extra = f" (+{row['ref_count']-len(row['refs'])} more)" if row['ref_count']>len(row['refs']) else ""
              lines.append(f"- [{row['status'] or 'err'}] {row['url']} — {refs}{extra}")
          pathlib.Path('dead-links-issue.md').write_text('\n'.join(lines))
          PY

      - name: Publish dead-link summary
        run: |
          python - <<'PY' >> "$GITHUB_STEP_SUMMARY"
          import json
          data = json.load(open('docs/sources/reports/dead-links.json'))
          print("# Dead Link Summary")
          print()
          print(f"- Scanned URLs: **{data['total']}**")
          print(f"- Dead URLs: **{data['dead_count']}**")
          print()
          if data['dead']:
              print("| URL | Status | Refs |")
              print("|---|---:|---|")
              for row in data['dead'][:10]:
                  refs = ', '.join(f"`{r}`" for r in row['refs'][:2])
                  print(f"| {row['url']} | {row['status'] or 'err'} | {refs} |")
          else:
              print("- No dead links detected.")
          PY

      - name: Reconcile dead-link issue
        if: steps.probe.outcome == 'success'
        uses: actions/github-script@v7
        env:
          DEAD_COUNT: ${{ steps.probe.outputs.dead_count }}
          REPORT_PATH: dead-links-issue.md
        with:
          script: |
            const fs = require('fs');
            const owner = context.repo.owner;
            const repo = context.repo.repo;
            const titlePrefix = '[Monthly] Dead link report';
            const labels = ['auto-sync', 'dead-links'];
            const deadCount = Number(process.env.DEAD_COUNT || '0');
            const openIssues = await github.paginate(github.rest.issues.listForRepo, {
              owner,
              repo,
              state: 'open',
              labels: labels.join(','),
              per_page: 100,
            });
            const matching = openIssues
              .filter(issue => !issue.pull_request && issue.title.startsWith(titlePrefix))
              .sort((a, b) => b.number - a.number);

            if (deadCount > 0) {
              const title = `${titlePrefix}: ${deadCount} URLs unreachable`;
              const body = fs.readFileSync(process.env.REPORT_PATH, 'utf8');
              let primary = matching.shift();
              if (primary) {
                await github.rest.issues.update({
                  owner,
                  repo,
                  issue_number: primary.number,
                  title,
                  body,
                });
              } else {
                primary = (await github.rest.issues.create({
                  owner,
                  repo,
                  title,
                  body,
                  labels,
                })).data;
              }
              for (const duplicate of matching) {
                await github.rest.issues.createComment({
                  owner,
                  repo,
                  issue_number: duplicate.number,
                  body: `Superseded by #${primary.number}; future runs update one canonical report.`,
                });
                await github.rest.issues.update({
                  owner,
                  repo,
                  issue_number: duplicate.number,
                  state: 'closed',
                  state_reason: 'completed',
                });
              }
            } else {
              for (const issue of matching) {
                await github.rest.issues.createComment({
                  owner,
                  repo,
                  issue_number: issue.number,
                  body: 'The latest monthly scan found no unreachable links. Closing automatically.',
                });
                await github.rest.issues.update({
                  owner,
                  repo,
                  issue_number: issue.number,
                  state: 'closed',
                  state_reason: 'completed',
                });
              }
            }

      - uses: actions/upload-artifact@v4
        with:
          name: dead-links-report
          path: docs/sources/reports/dead-links.json
          retention-days: 90
